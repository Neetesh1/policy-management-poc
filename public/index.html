<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Manager — ONLYOFFICE POC</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { background: #f0f4f8; min-height: 100vh; }
    .app-header {
      background: linear-gradient(135deg, #1565c0 0%, #0d47a1 100%);
      color: #fff;
      padding: 1.5rem 0;
      box-shadow: 0 2px 8px rgba(0,0,0,.2);
    }
    .upload-zone {
      border: 2px dashed #90caf9;
      border-radius: 12px;
      padding: 2.5rem 1rem;
      text-align: center;
      cursor: pointer;
      transition: background .2s, border-color .2s;
      background: #fff;
    }
    .upload-zone:hover, .upload-zone.dragover {
      background: #e3f2fd;
      border-color: #1565c0;
    }
    .card { border: none; box-shadow: 0 1px 6px rgba(0,0,0,.08); border-radius: 12px; }
    .doc-row:hover { background: #f5f9ff; }
    .badge-version { font-size: .7rem; letter-spacing: .03em; }
    .hash-cell { font-family: monospace; font-size: .78rem; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .action-cell .btn { font-size: .8rem; }
    .empty-state { padding: 3rem 1rem; color: #90a4ae; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="app-header mb-4">
    <div class="container d-flex align-items-center gap-3">
      <i class="bi bi-file-earmark-word fs-2"></i>
      <div>
        <h1 class="h4 mb-0 fw-bold">Document Manager</h1>
        <p class="mb-0 small opacity-75">ONLYOFFICE POC — Upload · Edit · Version</p>
      </div>
    </div>
  </header>

  <div class="container pb-5">

    <!-- Upload Card -->
    <div class="card mb-4">
      <div class="card-body p-4">
        <h5 class="mb-3"><i class="bi bi-cloud-upload me-2 text-primary"></i>Upload Document</h5>

        <div id="uploadZone" class="upload-zone mb-3" role="button" aria-label="Upload area">
          <i class="bi bi-file-earmark-plus display-5 text-primary mb-2 d-block"></i>
          <p class="mb-1 fw-semibold">Drop a .docx file here, or click to browse</p>
          <p class="text-muted small mb-0">Accepted: <strong>.docx</strong> &nbsp;|&nbsp; Max size: <strong>50 MB</strong></p>
          <input type="file" id="fileInput" accept=".docx" class="d-none" aria-hidden="true">
        </div>

        <div id="uploadProgress" class="d-none mb-2">
          <div class="progress" style="height:6px">
            <div class="progress-bar progress-bar-striped progress-bar-animated w-100"></div>
          </div>
          <p class="text-muted small text-center mt-1">Uploading…</p>
        </div>

        <div id="uploadAlert" class="d-none" role="alert"></div>
      </div>
    </div>

    <!-- Documents Card -->
    <div class="card">
      <div class="card-body p-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0"><i class="bi bi-files me-2 text-primary"></i>Documents</h5>
          <button class="btn btn-sm btn-outline-secondary" onclick="loadDocuments()">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
          </button>
        </div>
        <div id="documentsList">
          <div class="empty-state text-center">
            <i class="bi bi-hourglass-split fs-2 d-block mb-2"></i>Loading…
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Version History Modal -->
  <div class="modal fade" id="versionsModal" tabindex="-1" aria-labelledby="versionsModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="versionsModalLabel">
            <i class="bi bi-clock-history me-2"></i>Version History
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="versionsContent">
          <div class="text-center py-3">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading…</span></div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // ── Upload ──────────────────────────────────────────────────────────────────
    const uploadZone = document.getElementById('uploadZone');
    const fileInput  = document.getElementById('fileInput');

    uploadZone.addEventListener('click', () => fileInput.click());
    uploadZone.addEventListener('dragover', e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      if (e.dataTransfer.files[0]) handleUpload(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', e => { if (e.target.files[0]) handleUpload(e.target.files[0]); });

    function showUploadAlert(type, html) {
      const el = document.getElementById('uploadAlert');
      el.className = `alert alert-${type}`;
      el.innerHTML = html;
      el.classList.remove('d-none');
      if (type === 'success') setTimeout(() => el.classList.add('d-none'), 6000);
    }

    async function handleUpload(file) {
      if (!file.name.toLowerCase().endsWith('.docx')) {
        return showUploadAlert('danger', '<i class="bi bi-x-circle me-2"></i>Only <strong>.docx</strong> files are allowed.');
      }
      if (file.size > 50 * 1024 * 1024) {
        return showUploadAlert('danger', '<i class="bi bi-x-circle me-2"></i>File exceeds the 50 MB size limit.');
      }

      document.getElementById('uploadProgress').classList.remove('d-none');
      document.getElementById('uploadAlert').classList.add('d-none');

      const formData = new FormData();
      formData.append('file', file);

      try {
        const res  = await fetch('/upload', { method: 'POST', body: formData });
        const data = await res.json();
        document.getElementById('uploadProgress').classList.add('d-none');

        if (res.ok && data.success) {
          showUploadAlert('success',
            `<i class="bi bi-check-circle me-2"></i>Uploaded <strong>${escapeHtml(data.title)}</strong> successfully.`);
          fileInput.value = '';
          loadDocuments();
        } else {
          showUploadAlert('danger', `<i class="bi bi-x-circle me-2"></i>${escapeHtml(data.error || 'Upload failed.')}`);
        }
      } catch {
        document.getElementById('uploadProgress').classList.add('d-none');
        showUploadAlert('danger', '<i class="bi bi-x-circle me-2"></i>Network error. Please try again.');
      }
    }

    // ── Document list ───────────────────────────────────────────────────────────
    async function loadDocuments() {
      const container = document.getElementById('documentsList');
      try {
        const res  = await fetch('/api/documents');
        const docs = await res.json();

        if (!Array.isArray(docs) || docs.length === 0) {
          container.innerHTML = `
            <div class="empty-state text-center">
              <i class="bi bi-file-earmark display-4 d-block mb-3"></i>
              <p class="mb-0">No documents yet — upload your first <strong>.docx</strong> above.</p>
            </div>`;
          return;
        }

        container.innerHTML = `
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-light">
                <tr>
                  <th>Name</th>
                  <th>Version</th>
                  <th>Created</th>
                  <th>Last Updated</th>
                  <th class="text-end pe-3">Actions</th>
                </tr>
              </thead>
              <tbody>
                ${docs.map(doc => `
                  <tr class="doc-row">
                    <td>
                      <span class="d-flex align-items-center gap-2">
                        <i class="bi bi-file-earmark-word text-primary fs-5"></i>
                        <span class="fw-semibold">${escapeHtml(doc.title)}</span>
                      </span>
                    </td>
                    <td><span class="badge bg-primary badge-version">v${doc.currentVersion}</span></td>
                    <td class="text-muted small">${fmtDate(doc.createdAt)}</td>
                    <td class="text-muted small">${fmtDate(doc.updatedAt)}</td>
                    <td class="text-end action-cell pe-1">
                      <a href="/editor/${doc.id}" target="_blank" class="btn btn-sm btn-primary me-1">
                        <i class="bi bi-pencil-square me-1"></i>Edit
                      </a>
                      <a href="/download/${doc.id}" class="btn btn-sm btn-outline-secondary me-1">
                        <i class="bi bi-download me-1"></i>Download
                      </a>
                      <button class="btn btn-sm btn-outline-info"
                        onclick="showVersions('${doc.id}', '${escapeHtml(doc.title).replace(/'/g, "\\'")}')">
                        <i class="bi bi-clock-history me-1"></i>History
                      </button>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      } catch {
        container.innerHTML = '<div class="alert alert-danger m-2">Failed to load documents.</div>';
      }
    }

    // ── Version history modal ───────────────────────────────────────────────────
    async function showVersions(docId, title) {
      document.getElementById('versionsModalLabel').innerHTML =
        `<i class="bi bi-clock-history me-2"></i>Version History — ${escapeHtml(title)}`;
      document.getElementById('versionsContent').innerHTML = `
        <div class="text-center py-3">
          <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Loading…</span></div>
        </div>`;

      new bootstrap.Modal(document.getElementById('versionsModal')).show();

      try {
        const res  = await fetch(`/versions/${docId}`);
        const data = await res.json();

        document.getElementById('versionsContent').innerHTML = `
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle mb-0">
              <thead class="table-light">
                <tr><th>Version</th><th>Saved At</th><th>By</th><th>SHA-256</th><th>Download</th></tr>
              </thead>
              <tbody>
                ${data.versions.map(v => `
                  <tr ${v.versionNo === data.currentVersion ? 'class="table-primary"' : ''}>
                    <td>
                      <span class="badge bg-secondary me-1">v${v.versionNo}</span>
                      ${v.versionNo === data.currentVersion ? '<span class="badge bg-success">latest</span>' : ''}
                    </td>
                    <td class="small">${fmtDate(v.createdAt)}</td>
                    <td class="small">${escapeHtml(v.createdBy)}</td>
                    <td class="hash-cell" title="${v.fileHash}">${v.fileHash}</td>
                    <td>
                      <a href="${v.downloadUrl}" class="btn btn-sm btn-outline-secondary">
                        <i class="bi bi-download"></i>
                      </a>
                    </td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <hr class="my-3">
          <h6 class="text-muted mb-2"><i class="bi bi-journal-text me-1"></i>Audit Log</h6>
          <div class="table-responsive">
            <table class="table table-sm table-hover mb-0">
              <thead class="table-light">
                <tr><th>Action</th><th>Version</th><th>User</th><th>Timestamp</th></tr>
              </thead>
              <tbody>
                ${[...data.audit].reverse().map(a => `
                  <tr>
                    <td><span class="badge bg-secondary">${escapeHtml(a.action)}</span></td>
                    <td>v${a.versionNo}</td>
                    <td class="small">${escapeHtml(a.userId)}</td>
                    <td class="small">${fmtDate(a.timestamp)}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>`;
      } catch {
        document.getElementById('versionsContent').innerHTML =
          '<div class="alert alert-danger">Failed to load version history.</div>';
      }
    }

    // ── Helpers ─────────────────────────────────────────────────────────────────
    function fmtDate(iso) { return new Date(iso).toLocaleString(); }

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.appendChild(document.createTextNode(String(text)));
      return d.innerHTML;
    }

    // Initial load
    loadDocuments();
  </script>
</body>
</html>
