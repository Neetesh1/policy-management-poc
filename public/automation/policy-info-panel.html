<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Policy Document Info</title>
  <style>
    html, body {
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f9fc;
      color: #1b2b4b;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px;
      color: #1565c0;
    }
    dl { margin: 0; }
    dt { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #6b7a99; margin-top: 10px; }
    dd { margin: 2px 0 0; font-size: 13px; font-weight: 600; word-break: break-word; }
    .footer { margin-top: 16px; font-size: 11px; color: #94a3b8; }
  </style>
</head>
<body>
  <h1>Policy Management — Document Info</h1>
  <dl id="info"></dl>
  <p class="footer">Delivered via ONLYOFFICE Automation API connector window.</p>

  <script>
    // Panel content driven entirely by query params passed from editor.html at open time.
    const params = new URLSearchParams(window.location.search);
    const fields = [
      ['Title', params.get('title') || '—'],
      ['Role', params.get('role') || '—'],
      ['User', params.get('userName') || '—']
    ];
    const dl = document.getElementById('info');
    fields.forEach(([label, value]) => {
      const dt = document.createElement('dt');
      dt.textContent = label;
      const dd = document.createElement('dd');
      dd.textContent = value;
      dl.appendChild(dt);
      dl.appendChild(dd);
    });
  </script>
</body>
</html>
