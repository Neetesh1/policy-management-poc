<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Editor — ONLYOFFICE POC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a237e;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      height: 44px;
      background: #1565c0;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    #topbar a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color .15s;
    }
    #topbar a:hover { color: #fff; }
    #docTitle {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }
    #topbarRight { font-size: 11px; opacity: .6; white-space: nowrap; }

    /* Role badge */
    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .role-editor   { background: rgba(255,255,255,.15); color: #fff; }
    .role-reviewer { background: #f59e0b; color: #1a1a1a; }
    .role-commenter { background: #38bdf8; color: #1a1a1a; }

    /* ── Editor container ── */
    #editorWrap {
      height: calc(100vh - 44px);
      position: relative;
    }
    #placeholder { width: 100%; height: 100%; }

    /* ── Overlays ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a237e;
      color: #fff;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      transition: opacity .3s;
    }
    .overlay.hidden { display: none; }

    /* Loading */
    .spinner {
      width: 52px; height: 52px;
      border: 5px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 15px; opacity: .8; }

    /* Error */
    #errorOverlay .icon { font-size: 3rem; margin-bottom: 16px; }
    #errorOverlay h2 { font-size: 1.4rem; margin-bottom: 10px; }
    #errorMessage { opacity: .8; font-size: 14px; max-width: 520px; margin-bottom: 24px; line-height: 1.6; }
    #errorOverlay a {
      color: #82b1ff;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid #82b1ff;
      padding: 6px 16px;
      border-radius: 4px;
      transition: background .15s;
    }
    #errorOverlay a:hover { background: rgba(130,177,255,.15); }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <a href="/" title="Back to Document Manager">
      &#8592; Document Manager
    </a>
    <span id="docTitle">Loading document&hellip;</span>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="roleBadge"></span>
      <span id="topbarRight">ONLYOFFICE POC</span>
    </div>
  </div>

  <!-- Editor wrapper -->
  <div id="editorWrap">
    <div id="placeholder"></div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="overlay">
      <div class="spinner"></div>
      <p id="loadingText">Loading editor&hellip;</p>
    </div>

    <!-- Error overlay -->
    <div id="errorOverlay" class="overlay hidden">
      <div class="icon">&#9888;&#65039;</div>
      <h2>Failed to load editor</h2>
      <p id="errorMessage"></p>
      <a href="/">&#8592; Back to Document Manager</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Extract documentId from the URL path: /editor/<uuid>
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const documentId = pathParts[pathParts.length - 1];

      // Extract role from query string (?role=editor|reviewer|commenter)
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || 'editor';
      const user = urlParams.get('user') || 'poc-user-1';

      const ROLE_LABELS = {
        editor:    { label: 'Editor',    cls: 'role-editor' },
        reviewer:  { label: 'Reviewing', cls: 'role-reviewer' },
        commenter: { label: 'Commenting', cls: 'role-commenter' }
      };

      function showError(msg) {
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('errorMessage').textContent = msg;
        document.getElementById('errorOverlay').classList.remove('hidden');
      }

      function hideLoading() {
        document.getElementById('loadingOverlay').classList.add('hidden');
      }

      async function initEditor() {
        try {
          // 1. Fetch app config (ONLYOFFICE server URL)
          const cfgRes = await fetch('/api/config');
          if (!cfgRes.ok) throw new Error('Could not fetch app configuration.');
          const appCfg = await cfgRes.json();
          const onlyofficeServerUrl = appCfg.onlyofficeServerUrl || 'http://localhost:8080';

          // 2. Fetch ONLYOFFICE editor config (JWT-signed) with the selected role and user
          const editorCfgRes = await fetch(`/api/editor-config/${documentId}?role=${encodeURIComponent(role)}&user=${encodeURIComponent(user)}`);
          if (!editorCfgRes.ok) {
            const err = await editorCfgRes.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${editorCfgRes.status}: could not load editor config.`);
          }
          const editorConfig = await editorCfgRes.json();

          // Update page title
          const title = (editorConfig.document && editorConfig.document.title) || 'Document';
          document.title = `${title} — ONLYOFFICE POC`;
          document.getElementById('docTitle').textContent = title;

          // Show role badge in top bar
          const roleMeta = ROLE_LABELS[editorConfig.role] || ROLE_LABELS.editor;
          const badge = document.getElementById('roleBadge');
          badge.textContent = roleMeta.label;
          badge.className = `role-badge ${roleMeta.cls}`;

          // Show user name in top bar
          if (editorConfig.user && editorConfig.user.name) {
            document.getElementById('topbarRight').textContent = editorConfig.user.name;
          }

          // 3. Dynamically load the ONLYOFFICE API script from the Document Server
          const script = document.createElement('script');
          script.src = `${onlyofficeServerUrl}/web-apps/apps/api/documents/api.js`;

          script.onerror = () => {
            showError(
              `Could not connect to ONLYOFFICE Document Server at:\n${onlyofficeServerUrl}\n\n` +
              'Make sure the server is running and accessible. ' +
              'If using Docker, verify the service is healthy on port 8080.'
            );
          };

          script.onload = () => {
            hideLoading();
            // eslint-disable-next-line no-undef
            new DocsAPI.DocEditor('placeholder', editorConfig);
          };

          document.head.appendChild(script);

        } catch (err) {
          showError(err.message || 'An unexpected error occurred.');
        }
      }

      initEditor();
    }());
  </script>
</body>
</html>
