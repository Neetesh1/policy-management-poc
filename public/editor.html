<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document Editor — ONLYOFFICE POC</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a237e;
      overflow: hidden;
    }

    /* ── Top bar ── */
    #topbar {
      height: 44px;
      background: #1565c0;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      gap: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      flex-shrink: 0;
      position: relative;
      z-index: 10;
    }
    #topbar a {
      color: rgba(255,255,255,.85);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: color .15s;
    }
    #topbar a:hover { color: #fff; }
    #docTitle {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 60vw;
    }
    #topbarRight { font-size: 11px; opacity: .6; white-space: nowrap; }

    /* Role badge */
    .role-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 10px;
      border-radius: 20px;
      white-space: nowrap;
      letter-spacing: .04em;
      text-transform: uppercase;
    }
    .role-editor   { background: rgba(255,255,255,.15); color: #fff; }
    .role-reviewer { background: #f59e0b; color: #1a1a1a; }
    .role-commenter { background: #38bdf8; color: #1a1a1a; }

    /* ── Editor container ── */
    #editorWrap {
      height: calc(100vh - 44px);
      position: relative;
    }
    #placeholder { width: 100%; height: 100%; }

    /* ── Overlays ── */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a237e;
      color: #fff;
      z-index: 20;
      text-align: center;
      padding: 2rem;
      transition: opacity .3s;
    }
    .overlay.hidden { display: none; }

    /* Loading */
    .spinner {
      width: 52px; height: 52px;
      border: 5px solid rgba(255,255,255,.2);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .9s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingText { font-size: 15px; opacity: .8; }

    /* Error */
    #errorOverlay .icon { font-size: 3rem; margin-bottom: 16px; }
    #errorOverlay h2 { font-size: 1.4rem; margin-bottom: 10px; }
    #errorMessage { opacity: .8; font-size: 14px; max-width: 520px; margin-bottom: 24px; line-height: 1.6; }
    #errorOverlay a {
      color: #82b1ff;
      text-decoration: none;
      font-size: 13px;
      border: 1px solid #82b1ff;
      padding: 6px 16px;
      border-radius: 4px;
      transition: background .15s;
    }
    #errorOverlay a:hover { background: rgba(130,177,255,.15); }
  </style>
</head>
<body>

  <!-- Top bar -->
  <div id="topbar">
    <a href="/" title="Back to Document Manager">
      &#8592; Document Manager
    </a>
    <span id="docTitle">Loading document&hellip;</span>
    <div style="display:flex;align-items:center;gap:8px">
      <span id="roleBadge"></span>
      <span id="topbarRight">ONLYOFFICE POC</span>
    </div>
  </div>

  <!-- Editor wrapper -->
  <div id="editorWrap">
    <div id="placeholder"></div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="overlay">
      <div class="spinner"></div>
      <p id="loadingText">Loading editor&hellip;</p>
    </div>

    <!-- Error overlay -->
    <div id="errorOverlay" class="overlay hidden">
      <div class="icon">&#9888;&#65039;</div>
      <h2>Failed to load editor</h2>
      <p id="errorMessage"></p>
      <a href="/">&#8592; Back to Document Manager</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      // Extract documentId from the URL path: /editor/<uuid>
      const pathParts = window.location.pathname.split('/').filter(Boolean);
      const documentId = pathParts[pathParts.length - 1];

      // Extract role from query string (?role=editor|reviewer|commenter)
      const urlParams = new URLSearchParams(window.location.search);
      const role = urlParams.get('role') || 'editor';
      const user = urlParams.get('user') || 'poc-user-1';

      const ROLE_LABELS = {
        editor:    { label: 'Editor',    cls: 'role-editor' },
        reviewer:  { label: 'Reviewing', cls: 'role-reviewer' },
        commenter: { label: 'Commenting', cls: 'role-commenter' }
      };

      function showError(msg) {
        document.getElementById('loadingOverlay').classList.add('hidden');
        document.getElementById('errorMessage').textContent = msg;
        document.getElementById('errorOverlay').classList.remove('hidden');
      }

      function hideLoading() {
        document.getElementById('loadingOverlay').classList.add('hidden');
      }

      // ── Automation API (custom branded toolbar tab + info panel) ────────────────
      // https://api.onlyoffice.com/docs/docs-api/usage-api/automation-api/
      // https://api.onlyoffice.com/docs/docs-api/usage-api/automation-api/connector-class/
      // Automation API is a separate premium feature from white-label branding: it can't
      // toggle/hide native ONLYOFFICE chrome, but it can add our own custom UI elements,
      // listen to Document API events (https://api.onlyoffice.com/docs/plugins/interacting-with-editors/document-api/Events/)
      // and call Document API methods from outside the editor.
      let automationConnector = null;

      // Reports a connector-observed event to the server-side audit trail so it
      // shows up in the revision history alongside upload/save events.
      function reportAuditEvent(action, userId, meta) {
        fetch(`/api/audit-event/${documentId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action, userId, meta })
        }).catch(err => console.warn('[Automation API] failed to report audit event:', err));
      }

      // Persists structured tag metadata (key/color/content-control id) to the custom DB,
      // linked to this document via documentId — replaces the old in-doc Word comment.
      const POLICY_TAG_COLORS = new Set(['needs-review', 'compliant']);
      function persistPolicyTag(obj, userId) {
        const tagStr = (obj && obj.tag) || '';
        const policyMatch = /^\{policy:(.+)\}$/.exec(tagStr);
        const regulationMatch = /^\{regulation:(.+)\}$/.exec(tagStr);

        let tagType, tagKey, colorKey;
        if (regulationMatch) {
          tagType = 'regulation';
          tagKey = regulationMatch[1];
          colorKey = 'regulation';
        } else if (policyMatch) {
          tagType = 'policy';
          tagKey = policyMatch[1];
          colorKey = POLICY_TAG_COLORS.has(tagKey) ? tagKey : 'custom';
        } else {
          return;
        }

        fetch(`/api/tags/${documentId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ tagKey, tagType, colorKey, contentControlId: obj.id, userId })
        }).catch(err => console.warn('[Policy Tagging] failed to persist tag:', err));
      }

      // ── Tagged Paragraphs panel: reads straight from the custom DB (server-side),
      // avoiding the native plugin's GetAllContentControls list which can go stale
      // until a full page reload. "Go to" jumps to the paragraph via the connector.
      function ensureTagsPanel() {
        let panel = document.getElementById('tagsPanel');
        if (panel) return panel;

        panel = document.createElement('div');
        panel.id = 'tagsPanel';
        panel.style.cssText = 'position:absolute;top:12px;right:12px;width:320px;max-height:70vh;' +
          'overflow-y:auto;background:#fff;border-radius:10px;box-shadow:0 8px 28px rgba(0,0,0,.25);' +
          'z-index:30;display:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;';
        panel.innerHTML = `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid #e8ecf2;">
            <strong style="font-size:14px;color:#1b2b4b;">Tagged Paragraphs</strong>
            <div>
              <button id="tagsPanelRefresh" style="border:none;background:none;cursor:pointer;font-size:12px;color:#1565c0;margin-right:8px;">Refresh</button>
              <button id="tagsPanelClose" style="border:none;background:none;cursor:pointer;font-size:14px;color:#94a3b8;">&times;</button>
            </div>
          </div>
          <div id="tagsPanelList" style="padding:8px 14px;"></div>`;
        document.getElementById('editorWrap').appendChild(panel);

        document.getElementById('tagsPanelClose').onclick = () => { panel.style.display = 'none'; };
        document.getElementById('tagsPanelRefresh').onclick = () => loadTagsPanel();
        return panel;
      }

      async function loadTagsPanel() {
        const list = document.getElementById('tagsPanelList');
        list.innerHTML = '<p style="font-size:12px;color:#94a3b8;text-align:center;padding:12px 0;">Loading…</p>';
        try {
          const res = await fetch(`/api/tags/${documentId}`);
          const tags = await res.json();

          if (!Array.isArray(tags) || tags.length === 0) {
            list.innerHTML = '<p style="font-size:12px;color:#94a3b8;text-align:center;padding:12px 0;">No tags yet.</p>';
            return;
          }

          list.innerHTML = tags.map(t => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid #f0f2f6;">
              <div style="min-width:0;">
                <div style="font-size:12px;font-weight:600;color:#1b2b4b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">
                  ${t.tagType === 'regulation' ? '📋' : '🏷️'} ${escapeHtmlLocal(t.label || t.tagKey)}
                </div>
                <div style="font-size:11px;color:#94a3b8;">${escapeHtmlLocal(t.userId)} · ${new Date(t.createdAt).toLocaleString()}</div>
              </div>
              <button class="tagGoToBtn" data-cc-id="${escapeHtmlLocal(t.contentControlId || '')}"
                style="border:1px solid #d0d7e2;background:#fff;border-radius:6px;padding:4px 8px;font-size:11px;cursor:pointer;flex-shrink:0;margin-left:8px;">
                Go to
              </button>
            </div>`).join('');

          list.querySelectorAll('.tagGoToBtn').forEach(btn => {
            btn.onclick = () => {
              const ccId = btn.getAttribute('data-cc-id');
              if (!ccId || !automationConnector) return;
              automationConnector.executeMethod('SelectContentControl', [ccId]);
            };
          });
        } catch (err) {
          list.innerHTML = '<p style="font-size:12px;color:#c0392b;text-align:center;padding:12px 0;">Failed to load tags.</p>';
        }
      }

      function escapeHtmlLocal(text) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(String(text == null ? '' : text)));
        return d.innerHTML;
      }

      function showTagsPanel() {
        const panel = ensureTagsPanel();
        panel.style.display = 'block';
        loadTagsPanel();
      }


      function initAutomationConnector(docEditorInstance, meta) {
        if (!docEditorInstance || typeof docEditorInstance.createConnector !== 'function') return;

        try {
          automationConnector = docEditorInstance.createConnector();
        } catch (err) {
          console.warn('[Automation API] createConnector() failed — likely not licensed on this Document Server:', err);
          return;
        }

        const userId = (meta.user && meta.user.id) || 'unknown';
        const isReviewCapableRole = meta.role === 'editor' || meta.role === 'reviewer';

        // ── Paragraph tagging: detect edits to tagged content controls in real time ──
        try {
          automationConnector.attachEvent('onChangeContentControl', (obj) => {
            reportAuditEvent('CONTENT_CONTROL_CHANGED', userId, { tag: obj && obj.tag, id: obj && obj.id });
            persistPolicyTag(obj, userId);
          });
        } catch (err) {
          console.warn('[Automation API] attachEvent(onChangeContentControl) failed:', err);
        }

        // ── Revision tracking: comment lifecycle events feed the audit trail live ──
        try {
          automationConnector.attachEvent('onAddComment', (obj) => {
            reportAuditEvent('COMMENT_ADDED', userId, { commentId: obj && obj.Id });
          });
          automationConnector.attachEvent('onChangeCommentData', (obj) => {
            reportAuditEvent('COMMENT_CHANGED', userId, { commentId: obj && obj.Id });
          });
          automationConnector.attachEvent('onRemoveComment', (obj) => {
            reportAuditEvent('COMMENT_REMOVED', userId, { commentIds: obj });
          });
        } catch (err) {
          console.warn('[Automation API] attachEvent(comment events) failed:', err);
        }

        const toolbarItems = [{
          id: 'policyToolsInfoBtn',
          type: 'button',
          text: 'Document Info',
          hint: 'Show policy document metadata (via Automation API)',
          onClick: () => showPolicyInfoPanel(meta)
        }, {
          id: 'policyToolsTagsBtn',
          type: 'button',
          text: 'Tagged Paragraphs',
          hint: 'View all paragraph tags and regulations assigned in this document',
          onClick: () => showTagsPanel()
        }];

        // ── Revision tracking: accept/reject tracked changes from outside the editor ──
        // https://api.onlyoffice.com/docs/plugins/interacting-with-editors/document-api/Methods/
        if (isReviewCapableRole) {
          toolbarItems.push(
            {
              id: 'policyAcceptChangesBtn',
              type: 'button',
              text: 'Accept All Changes',
              hint: 'Accept all tracked changes (Automation API: AcceptReviewChanges)',
              onClick: () => {
                automationConnector.executeMethod('AcceptReviewChanges', [], () => {
                  reportAuditEvent('REVIEW_CHANGES_ACCEPTED', userId, {});
                });
              }
            },
            {
              id: 'policyRejectChangesBtn',
              type: 'button',
              text: 'Reject All Changes',
              hint: 'Reject all tracked changes (Automation API: RejectReviewChanges)',
              onClick: () => {
                automationConnector.executeMethod('RejectReviewChanges', [], () => {
                  reportAuditEvent('REVIEW_CHANGES_REJECTED', userId, {});
                });
              }
            }
          );
        }

        try {
          automationConnector.addToolbarMenuItem({
            guid: 'asc.policy-management-automation-api',
            tabs: [{
              id: 'policyToolsTab',
              text: 'Policy Tools',
              items: toolbarItems
            }]
          });
        } catch (err) {
          console.warn('[Automation API] addToolbarMenuItem() failed:', err);
        }
      }

      function showPolicyInfoPanel(meta) {
        if (!automationConnector) return;
        try {
          const params = new URLSearchParams({
            title: meta.title || '',
            role: (meta.role || 'editor'),
            userName: (meta.user && meta.user.name) || ''
          });
          const win = automationConnector.createWindow();
          win.show({
            url: `/automation/policy-info-panel.html?${params.toString()}`,
            description: 'Policy Document Info',
            type: 'panel',
            EditorsSupport: ['word'],
            isVisual: true,
            buttons: []
          });
        } catch (err) {
          console.warn('[Automation API] createWindow()/show() failed:', err);
        }
      }

      async function initEditor() {
        try {
          // 1. Fetch app config (ONLYOFFICE server URL)
          const cfgRes = await fetch('/api/config');
          if (!cfgRes.ok) throw new Error('Could not fetch app configuration.');
          const appCfg = await cfgRes.json();
          const onlyofficeServerUrl = appCfg.onlyofficeServerUrl || 'http://localhost:8080';

          // 2. Fetch ONLYOFFICE editor config (JWT-signed) with the selected role and user
          const editorCfgRes = await fetch(`/api/editor-config/${documentId}?role=${encodeURIComponent(role)}&user=${encodeURIComponent(user)}`);
          if (!editorCfgRes.ok) {
            const err = await editorCfgRes.json().catch(() => ({}));
            throw new Error(err.error || `HTTP ${editorCfgRes.status}: could not load editor config.`);
          }
          const editorConfig = await editorCfgRes.json();

          // Update page title
          const title = (editorConfig.document && editorConfig.document.title) || 'Document';
          document.title = `${title} — ONLYOFFICE POC`;
          document.getElementById('docTitle').textContent = title;

          // Show role badge in top bar
          const roleMeta = ROLE_LABELS[editorConfig.role] || ROLE_LABELS.editor;
          const badge = document.getElementById('roleBadge');
          badge.textContent = roleMeta.label;
          badge.className = `role-badge ${roleMeta.cls}`;

          // Show user name in top bar
          if (editorConfig.user && editorConfig.user.name) {
            document.getElementById('topbarRight').textContent = editorConfig.user.name;
          }

          // Automation API (https://api.onlyoffice.com/docs/docs-api/usage-api/automation-api/) is a
          // separate premium feature from white-label branding — it lets us add custom toolbar/UI
          // elements from outside the editor rather than toggle native chrome. Wired up once the
          // document is ready; functions can't travel through the signed JSON config, so it's attached here.
          editorConfig.events = {
            onDocumentReady: () => initAutomationConnector(docEditorInstance, { title, role: editorConfig.role, user: editorConfig.user })
          };

          // 3. Dynamically load the ONLYOFFICE API script from the Document Server
          const script = document.createElement('script');
          script.src = `${onlyofficeServerUrl}/web-apps/apps/api/documents/api.js`;

          script.onerror = () => {
            showError(
              `Could not connect to ONLYOFFICE Document Server at:\n${onlyofficeServerUrl}\n\n` +
              'Make sure the server is running and accessible. ' +
              'If using Docker, verify the service is healthy on port 8080.'
            );
          };

          let docEditorInstance = null;
          script.onload = () => {
            hideLoading();
            // eslint-disable-next-line no-undef
            docEditorInstance = new DocsAPI.DocEditor('placeholder', editorConfig);
          };

          document.head.appendChild(script);

        } catch (err) {
          showError(err.message || 'An unexpected error occurred.');
        }
      }

      initEditor();
    }());
  </script>
</body>
</html>
