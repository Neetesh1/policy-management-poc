<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f7f9fc;
        }

        .wrap {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .actions {
            display: flex;
            flex-direction: row;
            gap: 10px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .action-btn {
            border: 1px solid #d0d7e2;
            background: #ffffff;
            color: #1b2b4b;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            min-width: 130px;
        }

        .action-btn:hover {
            background: #eef4ff;
            border-color: #8ab4ff;
        }

        .divider {
            width: 100%;
            border-top: 1px solid #e0e6f0;
            margin: 6px 0;
        }

        select#regulationSelect {
            width: 100%;
            padding: 8px;
            border: 1px solid #d0d7e2;
            border-radius: 8px;
            font-size: 12px;
            box-sizing: border-box;
            background: #fff;
        }

        #tagCardFields dt { font-weight: 600; color: #64748b; margin-top: 6px; }
        #tagCardFields dd { margin: 1px 0 0; }
    </style>
    <script type="text/javascript" src="https://onlyoffice.github.io/sdkjs-plugins/v1/plugins.js"></script>
    <script type="text/javascript" src="scripts/code.js"></script>
</head>
<body>
    <div class="wrap">
        <div class="actions">
            <div id="tagCard" style="display:none;width:100%;background:#fff;border:1px solid #d0d7e2;border-radius:8px;padding:10px;text-align:left;">
                <p style="margin:0 0 6px;font-size:12px;font-weight:700;color:#1b2b4b;">Policy Tag</p>
                <dl id="tagCardFields" style="margin:0;font-size:11px;color:#334155;"></dl>
                <div style="display:flex;gap:6px;margin-top:8px;">
                    <button id="tagCardGoTo" class="action-btn" type="button" style="flex:1;">Go to Paragraph</button>
                    <button id="tagCardRemove" class="action-btn" type="button" style="flex:1;background:#fde8e8;border-color:#f5b5b5;">Remove Tag</button>
                </div>
            </div>
            <p style="width:100%;text-align:center;font-size:12px;color:#5b6b8c;margin-bottom:4px;">Select a paragraph in the document, then tag it:</p>
            <button id="quickTagReview" class="action-btn" type="button" style="width:100%;background:#fff3cd;border-color:#ffe08a;">Tag: Needs Review</button>
            <button id="quickTagCompliant" class="action-btn" type="button" style="width:100%;background:#d4edda;border-color:#a3d9ae;">Tag: Compliant</button>
            <input id="customTagInput" type="text" placeholder="Custom tag name" style="width:100%;padding:8px;border:1px solid #d0d7e2;border-radius:8px;font-size:12px;box-sizing:border-box;" />
            <button id="customTagBtn" class="action-btn" type="button" style="width:100%;">Tag Selected Paragraph</button>

            <div class="divider"></div>
            <p style="width:100%;text-align:center;font-size:12px;color:#5b6b8c;margin-bottom:4px;">Assign a regulation to the selected paragraph/title:</p>
            <select id="regulationSelect">
                <option value="">Loading regulations…</option>
            </select>
            <button id="assignRegulationBtn" class="action-btn" type="button" style="width:100%;background:#ede7f6;border-color:#b39ddb;">Assign Regulation</button>

            <div class="divider"></div>
            <p style="width:100%;text-align:center;font-size:12px;color:#5b6b8c;margin-bottom:4px;">After running Compare Versions, list what changed:</p>
            <button id="showReviewReportBtn" class="action-btn" type="button" style="width:100%;background:#fde8e8;border-color:#f5b5b5;">Show Change Report</button>
            <div id="reviewReportList" style="width:100%;max-height:220px;overflow-y:auto;font-size:11px;"></div>
        </div>
    </div>
</body>
</html>
