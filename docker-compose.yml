services:
  # ── ONLYOFFICE Document Server ──────────────────────────────────────────────
  onlyoffice:
    # Developer Edition image — required for license.lic activation to take effect
    image: onlyoffice/documentserver-de:latest
    container_name: onlyoffice-docs
    ports:
      - "3005:80"
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${JWT_SECRET:-poc-secret-change-in-production}"
      JWT_HEADER: "Authorization"
      JWT_PREFIX: "Bearer"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_log:/var/log/onlyoffice
      # Developer Edition trial license (see https://helpcenter.onlyoffice.com/docs/installation/docs-developer-activation.aspx)
      - ./license.lic:/var/www/onlyoffice/Data/license.lic:ro
    restart: unless-stopped

  # ── Node.js Application ─────────────────────────────────────────────────────
  app:
    build: .
    container_name: onlyoffice-app
    ports:
      - "4211:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"

      # Public URL that the browser uses to reach this app
      APP_URL: "http://localhost:4211"

      # Internal URL that ONLYOFFICE server uses to fetch files & send callbacks
      # Must use the Docker service name "app" so containers can reach each other
      ONLYOFFICE_APP_URL: "http://app:3000"

      # URL the browser uses to load the ONLYOFFICE editor API script
      # For remote access, set this to your server's IP or hostname + port 3005
      ONLYOFFICE_SERVER_URL: "http://10.112.5.69:3005"

      JWT_SECRET: "${JWT_SECRET:-poc-secret-change-in-production}"
    volumes:
      # Persist documents and DB outside the container
      - ./data:/app/data
    depends_on:
      - onlyoffice
    restart: unless-stopped

volumes:
  onlyoffice_data:
  onlyoffice_log:
